# The browser build (rust/build.sh web): a side module for Godot's
# single-threaded web engine with extension support. Flags from the
# godot-rust book, "Export to Web", without the thread flags.
[target.wasm32-unknown-emscripten]
rustflags = [
  "-C", "link-args=-sSIDE_MODULE=2",
  "-C", "llvm-args=-enable-emscripten-cxx-exceptions=0",
  "-Zdefault-visibility=hidden",
  "-Zlink-native-libraries=no",
]

name: web

# Builds the game for the browser and publishes it to GitHub Pages on
# every push to main that touches the game. Each deploy replaces the
# last one. Play at https://nowmichaelclark.github.io/brokenfriends/

on:
  push:
    branches: [main]
    paths: ["game/**", "rust/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  # Must match the Emscripten Godot's web engine was built with.
  EMSCRIPTEN_VERSION: "4.0.20"
  RUST_NIGHTLY: "nightly-2026-10-24"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and its web templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-dlink

      - name: Download Godot and its web templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j templates.tpz 'templates/web_nothreads_*' 'templates/web_dlink_nothreads_*' 'templates/version.txt' -d "$dest"

      # Driftloom's core as a Godot extension, for the browser
      # (rust/README.md). The game still builds if this step fails.
      - name: Install Rust for the browser build
        continue-on-error: true
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal \
            --component rust-src --target wasm32-unknown-emscripten

      - uses: mymindstorm/setup-emsdk@v14
        continue-on-error: true
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: emsdk-cache

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: rust/driftloom-godot

      - name: Build the Driftloom extension for the browser
        continue-on-error: true
        run: |
          GODOT4_BIN=~/godot/godot NIGHTLY="$RUST_NIGHTLY" rust/build.sh web

      - name: Export for the web
        run: |
          mkdir -p build/web
          # No extension built: ship the game without music rather than fail.
          if [ ! -f game/addons/driftloom/bin/web/driftloom_godot.wasm ]; then
            echo "::warning::Driftloom extension missing; deploying without music"
            rm game/addons/driftloom/driftloom.gdextension
          fi
          ~/godot/godot --headless --path game --import || true
          ~/godot/godot --headless --path game --export-release "Web" ../build/web/index.html
          test -f build/web/index.wasm
          echo "Built $(git rev-parse --short HEAD) on $(date -u +%Y-%m-%dT%H:%MZ)" > build/web/version.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
